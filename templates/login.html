<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORDADOS G&C — Acceso</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background-image:url('/img/backgroundBordados.png?v=2');background-size:cover;background-position:center;
       background-attachment:fixed;background-color:#1a0a00}
  .card{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,200,100,0.2);
        border-radius:16px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
  .logo{text-align:center;margin-bottom:28px}
  .logo h1{color:#f0a500;font-size:22px;font-weight:800;letter-spacing:1px}
  .logo p{color:rgba(255,255,255,0.5);font-size:12px;margin-top:4px}
  .logo img.banner{width:100%;max-height:80px;object-fit:contain;margin-bottom:10px}
  .logo img.icon{width:60px;height:60px;object-fit:contain;margin-bottom:10px}
  label{display:block;color:rgba(255,255,255,0.7);font-size:12px;margin-bottom:6px;margin-top:18px}
  input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,200,100,0.25);
        border-radius:8px;color:#fff;font-size:14px;outline:none;transition:border 0.2s}
  input:focus{border-color:#f0a500}
  input::placeholder{color:rgba(255,255,255,0.3)}
  .btn{width:100%;margin-top:24px;padding:13px;background:linear-gradient(135deg,#c87800,#f0a500);
       border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s}
  .btn:hover{opacity:0.88}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .error{background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.4);border-radius:8px;
         color:#e74c3c;padding:10px 14px;font-size:13px;margin-top:14px;display:none}
  .footer{text-align:center;margin-top:24px;color:rgba(255,255,255,0.3);font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img class="banner" src="/img/Flogo.png?v=2" alt="BORDADOS G&C" onerror="this.style.display='none'">
    <img class="icon" src="/img/Blogo.png?v=2" alt="" onerror="this.style.display='none'">
    <h1>BORDADOS G&amp;C</h1>
    <p>Sistema de Gestión con IA · SENATI 2026</p>
  </div>
  <label>Usuario</label>
  <input id="user" type="text" placeholder="admin / empleado1" autocomplete="username">
  <label>Contraseña</label>
  <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()" id="btn">Ingresar</button>
  <div class="error" id="err"></div>
  <div class="footer">Azure OpenAI · GPT-4o-mini · Puente Piedra, Lima</div>
</div>

<script>
async function login() {
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btn');
  if (!user || !pass) { showErr('Completa todos los campos'); return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  err.style.display = 'none';
  try {
    const res  = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({username:user, password:pass}) });
    const data = await res.json();
    if (!res.ok) { showErr(data.detail || 'Error al ingresar'); return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('rol',   data.rol);
    localStorage.setItem('nombre',data.nombre);
    window.location.href = data.rol === 'admin' ? '/admin' : '/empleado';
  } catch(e) {
    showErr('No se puede conectar al servidor');
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}
function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}
// Si ya tiene sesión, redirigir
const t = localStorage.getItem('token');
const r = localStorage.getItem('rol');
if (t && r) window.location.href = r === 'admin' ? '/admin' : '/empleado';
</script>
</body>
</html>
